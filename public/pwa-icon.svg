<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18191D" />
      <stop offset="100%" stop-color="#090A0C" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F9B208" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#090A0C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="danfoYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Dark asphalt circle with yellow border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="256" r="220" fill="url(#glow)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#F9B208" stroke-width="8" stroke-opacity="0.8" />

  <!-- Road lane markings -->
  <line x1="256" y1="36" x2="256" y2="100" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="256" y1="412" x2="256" y2="476" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Speed lines -->
  <line x1="120" y1="180" x2="120" y2="280" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" />
  <line x1="392" y1="220" x2="392" y2="340" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Danfo Minibus Body -->
  <g transform="translate(256, 260) rotate(-6)">
    <!-- Shadow -->
    <ellipse cx="6" cy="12" rx="90" ry="140" fill="#000000" fill-opacity="0.6" />

    <!-- Yellow Van Body -->
    <rect x="-70" y="-120" width="140" height="230" rx="26" fill="url(#danfoYellow)" stroke="#B45309" stroke-width="4" />

    <!-- Double Black Commercial Stripes -->
    <rect x="-70" y="-40" width="140" height="12" fill="#18181B" />
    <rect x="-70" y="-18" width="140" height="12" fill="#18181B" />

    <!-- Front Windshield -->
    <rect x="-56" y="-105" width="112" height="46" rx="10" fill="#1E293B" stroke="#0F172A" stroke-width="3" />
    <path d="M-46 -98 L-15 -98 L-30 -68 L-52 -68 Z" fill="#FFFFFF" fill-opacity="0.25" />

    <!-- Rear Window -->
    <rect x="-50" y="70" width="100" height="24" rx="8" fill="#1E293B" />

    <!-- Side Windows -->
    <rect x="-66" y="-4" width="12" height="56" rx="4" fill="#334155" />
    <rect x="54" y="-4" width="12" height="56" rx="4" fill="#334155" />

    <!-- Roof Luggage Rack -->
    <rect x="-54" y="6" width="108" height="56" rx="8" fill="#475569" />
    <rect x="-44" y="14" width="38" height="22" rx="5" fill="#B45309" />
    <rect x="4" y="16" width="40" height="20" rx="5" fill="#047857" />
    <rect x="-38" y="38" width="76" height="18" rx="4" fill="#4338CA" />

    <!-- Headlights -->
    <rect x="-58" y="-122" width="24" height="8" rx="4" fill="#FEF08A" />
    <rect x="34" y="-122" width="24" height="8" rx="4" fill="#FEF08A" />

    <!-- Tail Lights -->
    <rect x="-58" y="104" width="22" height="8" rx="4" fill="#EF4444" />
    <rect x="36" y="104" width="22" height="8" rx="4" fill="#EF4444" />
  </g>
</svg>
